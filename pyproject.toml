[project]
name = "mediatagger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "whtlnv", email = "catala.francisco@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6-essentials>=6.12.0",
    "python-mpv>=1.0.8",
]

[project.scripts]
mediatagger = "mediatagger:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
